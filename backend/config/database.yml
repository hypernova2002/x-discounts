default: &default
  adapter: postgres
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  encoding: unicode
  # Each process (a Puma worker, the Sidekiq process) opens its own pool
  # sized by this value — it must cover whichever process uses the DB most
  # concurrently. Sidekiq's own default concurrency (10) is currently the
  # larger of the two; if RAILS_MAX_THREADS or Sidekiq concurrency are ever
  # raised past this, raise DATABASE_POOL to match.
  pool: <%= ENV.fetch("DATABASE_POOL", 10) %>

development:
  <<: *default
  database: x_discounts_development

test:
  <<: *default
  database: x_discounts_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "x_discounts_production") %>
