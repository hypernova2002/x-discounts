servers:
- url: "/"
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        otp_required:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      title: Account
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        action:
          type: string
          enum:
          - create
          - update
          - delete
        entity_type:
          type: string
        entity_label:
          type: string
        entity_public_id:
          type: string
          nullable: true
        actor_label:
          type: string
          nullable: true
        changes:
          type: object
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      title: ActivityLog
    ApiKey:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - developer
          - marketer
          - viewer
        user_id:
          type: string
        token_last_four:
          type: string
          description: Last 4 characters of the token, for display only
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      title: ApiKey
    ApiKeyCreateRequest:
      type: object
      required:
      - user_id
      - role
      - name
      properties:
        user_id:
          type: string
        role:
          type: string
          enum:
          - admin
          - developer
          - marketer
          - viewer
        name:
          type: string
      title: ApiKeyCreateRequest
    ApiKeyWithToken:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - developer
          - marketer
          - viewer
        user_id:
          type: string
        token_last_four:
          type: string
          description: Last 4 characters of the token, for display only
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        token:
          type: string
      title: ApiKeyWithToken
    Campaign:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        enabled:
          type: boolean
        archived:
          type: boolean
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          readOnly: true
        discount_kinds:
          type: array
          readOnly: true
          items:
            type: string
            enum:
            - promotion
            - coupon
            - loyalty
      title: Campaign
    ConditionNode:
      type: object
      description: Either a condition group (and/or/not + conditions) or a leaf condition
        (entity/key/operator/value).
      properties:
        operator:
          type: string
          description: and | or | not | eq | ne | gt | gte | lt | lte | in | not_in
            | contains | is_null | is_not_null
        entity:
          type: string
          enum:
          - cart
          - line_item
          - customer
        key:
          type: string
        value:
          description: Omit (or leave null) for is_null / is_not_null
        conditions:
          type: array
          items:
            "$ref": "#/components/schemas/ConditionNode"
      title: ConditionNode
    Coupon:
      type: object
      properties:
        code:
          type: string
        issued_from:
          type:
          - string
          - 'null'
          format: date-time
        issued_until:
          type:
          - string
          - 'null'
          format: date-time
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
      title: Coupon
    CouponCode:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
        max_redemptions:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        redemption_count:
          type: integer
          readOnly: true
        remaining_redemptions:
          type: integer
          readOnly: true
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: string
            external_id:
              type: string
            name:
              type: string
              nullable: true
      title: CouponCode
    CustomAttribute:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        entity:
          type: string
          enum:
          - cart
          - line_item
          - customer
        key:
          type: string
        data_type:
          type: string
          enum:
          - string
          - number
          - date
          - boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      title: CustomAttribute
    CustomAttributeCreateRequest:
      type: object
      required:
      - entity
      - key
      - data_type
      properties:
        entity:
          type: string
          enum:
          - cart
          - line_item
          - customer
        key:
          type: string
        data_type:
          type: string
          enum:
          - string
          - number
          - date
          - boolean
      title: CustomAttributeCreateRequest
    Customer:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        external_id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        marketing_opt_in:
          type: boolean
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      title: Customer
    CustomerCreateRequest:
      type: object
      required:
      - external_id
      properties:
        external_id:
          type: string
        name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        country:
          type: string
        date_of_birth:
          type: string
          format: date
        marketing_opt_in:
          type: boolean
        metadata:
          type: object
      title: CustomerCreateRequest
    Discount:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        key:
          type: string
          description: Unique, developer-supplied identifier (per project)
        kind:
          type: string
          enum:
          - promotion
          - coupon
        name:
          type: string
        stackable:
          type: boolean
        eligibility_condition:
          "$ref": "#/components/schemas/ConditionNode"
        promotion:
          anyOf:
          - "$ref": "#/components/schemas/Promotion"
          - type: 'null'
        coupon:
          anyOf:
          - "$ref": "#/components/schemas/Coupon"
          - type: 'null'
        effects:
          type: array
          items:
            "$ref": "#/components/schemas/DiscountEffect"
        max_redemptions:
          type: integer
          nullable: true
        max_redemptions_per_customer:
          type: integer
          nullable: true
        max_redemptions_per_day:
          type: integer
          nullable: true
        max_redemption_amount:
          type: number
          nullable: true
          description: Total across the discount's whole lifetime
        max_redemption_amount_per_day:
          type: number
          nullable: true
        max_redemption_amount_per_customer:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      title: Discount
    DiscountCreateRequest:
      type: object
      required:
      - kind
      - key
      - name
      properties:
        kind:
          type: string
          enum:
          - promotion
          - coupon
        key:
          type: string
          description: Unique per project. Letters, numbers, underscores, hyphens,
            periods.
        name:
          type: string
        stackable:
          type: boolean
          default: false
        eligibility_condition:
          "$ref": "#/components/schemas/ConditionNode"
        promotion:
          type: object
          description: Required when kind = promotion
          required:
          - active_from
          properties:
            active_from:
              type: string
              format: date-time
            active_until:
              type: string
              format: date-time
        coupon:
          type: object
          description: Required when kind = coupon
          required:
          - code
          properties:
            code:
              type: string
            issued_from:
              type: string
              format: date-time
            issued_until:
              type: string
              format: date-time
            valid_from:
              type: string
              format: date-time
            valid_until:
              type: string
              format: date-time
        effects:
          type: array
          items:
            type: object
            required:
            - effect_type
            - scope
            - config
            properties:
              effect_type:
                type: string
                enum:
                - percentage_off
                - fixed_amount_off
                - free_item
              scope:
                type: string
                enum:
                - cart
                - line_item
              target_condition:
                description: Required when scope = line_item
                anyOf:
                - "$ref": "#/components/schemas/ConditionNode"
                - type: 'null'
              config:
                type: object
                description: percentage_off -> {percentage}, fixed_amount_off -> {amount,
                  currency}, free_item -> {buy_quantity, get_quantity, repeatable,
                  buy_condition, get_condition}
        max_redemptions:
          type: integer
          description: Applies to promotions and coupons alike
        max_redemptions_per_customer:
          type: integer
        max_redemptions_per_day:
          type: integer
        max_redemption_amount:
          type: number
          description: Total across the discount's whole lifetime
        max_redemption_amount_per_day:
          type: number
        max_redemption_amount_per_customer:
          type: number
      title: DiscountCreateRequest
    DiscountEffect:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        effect_type:
          type: string
          enum:
          - percentage_off
          - fixed_amount_off
          - free_item
        scope:
          type: string
          enum:
          - cart
          - line_item
        target_condition:
          anyOf:
          - "$ref": "#/components/schemas/ConditionNode"
          - type: 'null'
        config:
          type: object
          description: 'Shape depends on effect_type: percentage_off -> {percentage},
            fixed_amount_off -> {amount, currency}, free_item -> {buy_quantity, get_quantity,
            repeatable, buy_condition, get_condition}'
      title: DiscountEffect
    DiscountValidationRequest:
      type: object
      properties:
        cart:
          type: object
          description: Arbitrary keys matched against cart custom attributes. total
            and item_count are reserved — always computed from line_items, not read
            from this object.
        line_items:
          type: array
          items:
            type: object
            required:
            - sku
            - quantity
            - unit_price
            properties:
              sku:
                type: string
              quantity:
                type: number
              unit_price:
                type: number
              additionalProperties: true
        customer:
          type: object
          description: external_id plus arbitrary keys matched against customer custom
            attributes.
          properties:
            external_id:
              type: string
        coupon_codes:
          type: array
          items:
            type: string
        as_of:
          type: string
          format: date-time
          description: 'Validate-only: preview against this time instead of now. Ignored
            by /discounts/redeem.'
      title: DiscountValidationRequest
    DiscountValidationResponse:
      type: object
      properties:
        applicable_discounts:
          type: array
          items:
            type: object
            properties:
              discount_id:
                type: string
              kind:
                type: string
                enum:
                - promotion
                - coupon
              key:
                type: string
              name:
                type: string
              effect_type:
                type: string
                enum:
                - percentage_off
                - fixed_amount_off
                - free_item
              amount_off:
                type: number
                description: Present for percentage_off / fixed_amount_off
              free_items:
                type: array
                description: Present for free_item
                items:
                  type: object
                  properties:
                    sku:
                      type: string
                    quantity:
                      type: integer
        total_amount_off:
          type: number
        coupons:
          type: array
          description: One entry per submitted coupon_code
          items:
            type: object
            properties:
              code:
                type: string
              valid:
                type: boolean
              reason:
                type: string
                nullable: true
              discounts:
