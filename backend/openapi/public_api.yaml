---
openapi: 3.1.0
info:
  title: x-discounts API
  version: v1
paths:
  "/api/v1/admin/account":
    get:
      summary: Show the current account
      tags:
      - Account
      operationId: getAccount
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns the account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
    patch:
      summary: Update the current account
      tags:
      - Account
      operationId: updateAccount
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: account updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '403':
          description: not an account admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/activity_logs":
    get:
      summary: List activity logs
      tags:
      - Activity Logs
      operationId: listActivityLogs
      parameters:
      - name: entity_type
        in: query
        schema:
          type: string
        required: false
      - name: log_action
        in: query
        schema:
          type: string
        required: false
      - name: user_id
        in: query
        schema:
          type: string
        required: false
      - name: from
        in: query
        schema:
          type: string
        required: false
      - name: to
        in: query
        schema:
          type: string
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          description: lists the project's logs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity_logs:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ActivityLog"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/api_keys":
    get:
      summary: List API keys
      tags:
      - API Keys
      operationId: listApiKeys
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns keys for the current project (no token field)
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ApiKey"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
    post:
      summary: Create an API key
      tags:
      - API Keys
      operationId: createApiKey
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ApiKeyCreateRequest"
      responses:
        '201':
          description: key created (raw token included once)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiKeyWithToken"
        '422':
          description: invalid user_id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/api_keys/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Show an API key
      tags:
      - API Keys
      operationId: getApiKey
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns the key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiKey"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    delete:
      summary: Revoke an API key
      tags:
      - API Keys
      operationId: revokeApiKey
      security:
      - BearerAuth: []
      responses:
        '204':
          description: key revoked
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/campaigns":
    get:
      summary: List campaigns
      tags:
      - Campaigns
      operationId: listCampaigns
      parameters:
      - name: q
        in: query
        schema:
          type: string
        required: false
      - name: page
        in: query
        schema:
          type: integer
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns campaigns for the current project
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Campaign"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/custom_attributes":
    get:
      summary: List custom attributes
      tags:
      - Custom Attributes
      operationId: listCustomAttributes
      parameters:
      - name: entity
        in: query
        schema:
          type: string
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns custom attributes for the current project
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom_attributes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CustomAttribute"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Create a custom attribute
      tags:
      - Custom Attributes
      operationId: createCustomAttribute
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomAttributeCreateRequest"
      responses:
        '201':
          description: attribute created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomAttribute"
        '422':
          description: duplicate entity+key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: not a write role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/custom_attributes/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    delete:
      summary: Delete a custom attribute
      tags:
      - Custom Attributes
      operationId: deleteCustomAttribute
      security:
      - BearerAuth: []
      responses:
        '204':
          description: attribute deleted
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/discounts":
    get:
      summary: List discounts
      tags:
      - Discounts
      operationId: listDiscounts
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns discounts for the current project
          content:
            application/json:
              schema:
                type: object
                properties:
                  discounts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Discount"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
    post:
      summary: Create a discount
      tags:
      - Discounts
      operationId: createDiscount
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DiscountCreateRequest"
      responses:
        '201':
          description: discount created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Discount"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/discounts/{discount_id}/compatible_discounts":
    parameters:
    - name: discount_id
      in: path
      schema:
        type: string
      required: true
    post:
      summary: Mark another discount as compatible
      tags:
      - Discount Compatibilities
      operationId: createDiscountCompatibility
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: returns the discount, now compatible with the other
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Discount"
        '422':
          description: an unresolvable compatible_discount_id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: not a write role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/discounts/{discount_id}/compatible_discounts/{id}":
    parameters:
    - name: discount_id
      in: path
      schema:
        type: string
      required: true
    - name: id
      in: path
      schema:
        type: string
      required: true
    delete:
      summary: Remove a compatibility
      tags:
      - Discount Compatibilities
      operationId: deleteDiscountCompatibility
      security:
      - BearerAuth: []
      responses:
        '204':
          description: removes an existing compatibility
        '403':
          description: not a write role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/discounts/{discount_id}/coupon_codes":
    parameters:
    - name: discount_id
      in: path
      schema:
        type: string
      required: true
    get:
      summary: List a discount's coupon codes
      tags:
      - Coupon Codes
      operationId: listCouponCodes
      parameters:
      - name: includes
        in: query
        schema:
          type: string
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          description: lists codes for the discount
          content:
            application/json:
              schema:
                type: object
                properties:
                  coupon_codes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/CouponCode"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Generate coupon codes
      tags:
      - Coupon Codes
      operationId: generateCouponCodes
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: generates a manual code
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CouponCode"
        '403':
          description: not a write role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/discounts/{discount_id}/coupon_codes/{id}":
    parameters:
    - name: discount_id
      in: path
      schema:
        type: string
      required: true
    - name: id
      in: path
      schema:
        type: string
      required: true
    delete:
      summary: Delete a coupon code
      tags:
      - Coupon Codes
      operationId: deleteCouponCode
      security:
      - BearerAuth: []
      responses:
        '204':
          description: deletes an unredeemed code
        '404':
          description: unknown code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: a code that's already been redeemed cannot be deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: not a write role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/discounts/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Show a discount
      tags:
      - Discounts
      operationId: getDiscount
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns the discount
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Discount"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    patch:
      summary: Update a discount
      tags:
      - Discounts
      operationId: updateDiscount
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: discount updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Discount"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    delete:
      summary: Delete a discount
      tags:
      - Discounts
      operationId: deleteDiscount
      security:
      - BearerAuth: []
      responses:
        '204':
          description: discount deleted
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/exports":
    get:
      summary: List exports
      tags:
      - Exports
      operationId: listExports
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns exports for the current project, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Export"
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      pages:
                        type: integer
                      count:
                        type: integer
    post:
      summary: Create an export
      tags:
      - Exports
      operationId: createExport
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExportCreateRequest"
      responses:
        '201':
          description: export queued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Export"
        '422':
          description: invalid export_type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/exports/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Show an export
      tags:
      - Exports
      operationId: getExport
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns the export
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Export"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/exports/{id}/download":
    parameters:
    - name: id
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Download a completed export
      tags:
      - Exports
      operationId: downloadExport
      security:
      - BearerAuth: []
      responses:
        '200':
          description: streams the generated file
        '404':
          description: not yet completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/api/v1/admin/gift_shop_items":
